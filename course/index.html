<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d34"><meta name="description" content="مسار موحد من خمس وحدات تعليمية تفاعلية لبناء مهارات وكلاء الذكاء الاصطناعي"><title>مسار وكلاء الذكاء الاصطناعي | خمس وحدات تعليمية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;color:#163a50;background:#edf7f9}*{box-sizing:border-box}body{margin:0}.skip{position:absolute;top:-80px;right:12px;z-index:50;background:white;padding:12px}.skip:focus{top:5px}
.course-header{background:linear-gradient(115deg,#061f38,#0b4660);color:#fff;padding:8px clamp(12px,2vw,22px);box-shadow:0 5px 18px #062c3c25}.heading{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.heading small{display:block;color:#a6e5e5;font-size:12px}.heading h1{font-size:clamp(18px,2vw,25px);margin:0;line-height:1.7;color:white}.home{color:#efffff;text-decoration:none;border:1px solid #6dcdd1;border-radius:11px;padding:7px 13px;font-size:13px}.home:hover,.home:focus{background:#165b72}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:13px}.tab{display:flex;flex-direction:column;gap:3px;border-radius:11px;background:#103c55;border:1px solid #38798b;padding:10px 12px;text-decoration:none;color:#d5edef;min-height:70px;transition:.18s}.tab:hover{border-color:#b3e6e5;background:#19536c}.tab[aria-current="step"]{background:#087f89;color:white;border:2px solid #8be4e2;box-shadow:0 4px 15px #042a3525}.tab .number{font-size:11px;color:#a8e1e1}.tab strong{font-size:13px;line-height:1.5}.player{display:flex;flex-direction:column;height:100dvh;min-height:440px}.player iframe{border:0;width:100%;flex:1;min-height:0;background:#fff}
@media(max-width:850px){.tabs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}.tab{flex:0 0 180px;scroll-snap-align:start}.player{height:100dvh}}
</style></head><body><a href="#content" class="skip">تخطي التنقل إلى محتوى الوحدة</a><main id="content" class="player"><iframe id="lesson" title="محتوى الوحدة التعليمية" src="../RLO1/" loading="eager" allow="fullscreen" referrerpolicy="same-origin"></iframe></main>
<script>
(()=>{'use strict';
const pages=['../RLO1/index.html?v=intro-three-cards-20261124','../RLO2/index.html?v=cards-20261124-1840','../RLO3/','../RLO4/index.html?v=unit-description-20261124','../RLO5/index.html?v=usage-instructions-20261124-2'];const frame=document.getElementById('lesson');let current=0;
function validUnit(){const raw=new URLSearchParams(location.search).get('unit');const n=Number(raw);return Number.isInteger(n)&&n>=1&&n<=5?n:1}
function render(n,load=true,push=false){current=n-1;if(load)frame.src=pages[current];if(push)history.pushState({unit:n},'', '?unit='+n);else history.replaceState({unit:n},'', '?unit='+n)}

window.addEventListener('popstate',()=>render(validUnit()));
frame.addEventListener('load',()=>{try{const url=frame.contentWindow.location.href;for(let i=0;i<5;i++){if(url.includes('/RLO'+(i+1)+'/')){if(i!==current)render(i+1,false,false);break}}}catch(e){}});
render(validUnit());
})();
</script><script src="../course-global-menu.js" defer></script>
</body></html>
