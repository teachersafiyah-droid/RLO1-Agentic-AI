<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d34"><meta name="description" content="مسار موحد من خمس وحدات تعليمية تفاعلية لبناء مهارات وكلاء الذكاء الاصطناعي"><title>مسار وكلاء الذكاء الاصطناعي | خمس وحدات تعليمية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;color:#163a50;background:#edf7f9}*{box-sizing:border-box}body{margin:0}.skip{position:absolute;top:-80px;right:12px;z-index:50;background:white;padding:12px}.skip:focus{top:5px}
.course-header{background:linear-gradient(115deg,#061f38,#0b4660);color:#fff;padding:8px clamp(12px,2vw,22px);box-shadow:0 5px 18px #062c3c25}.heading{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.heading small{display:block;color:#a6e5e5;font-size:12px}.heading h1{font-size:clamp(18px,2vw,25px);margin:0;line-height:1.7;color:white}.home{color:#efffff;text-decoration:none;border:1px solid #6dcdd1;border-radius:11px;padding:7px 13px;font-size:13px}.home:hover,.home:focus{background:#165b72}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:13px}.tab{display:flex;flex-direction:column;gap:3px;border-radius:11px;background:#103c55;border:1px solid #38798b;padding:10px 12px;text-decoration:none;color:#d5edef;min-height:70px;transition:.18s}.tab:hover{border-color:#b3e6e5;background:#19536c}.tab[aria-current="step"]{background:#087f89;color:white;border:2px solid #8be4e2;box-shadow:0 4px 15px #042a3525}.tab .number{font-size:11px;color:#a8e1e1}.tab strong{font-size:13px;line-height:1.5}.player{display:flex;flex-direction:column;height:calc(100dvh - 72px);min-height:440px}.player iframe{border:0;width:100%;flex:1;min-height:0;background:#fff}.course-footer{background:#f6fbfc;border-top:1px solid #c6dce0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 20px;font-size:13px}.course-footer span{font-weight:700}.course-footer a{color:#07596c;text-decoration:none;border:1px solid #a3cdd2;background:white;border-radius:9px;padding:7px 14px}.course-footer a:hover{background:#e4f5f5}.course-footer a[hidden]{display:none}.player-status{font-size:11px;color:#54747c;font-weight:normal}
@media(max-width:850px){.tabs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}.tab{flex:0 0 180px;scroll-snap-align:start}.player{height:calc(100dvh - 83px)}.course-footer{padding:8px;gap:5px}.course-footer a{padding:7px 9px;font-size:11px}.course-footer span{font-size:12px}}
</style></head><body><a href="#content" class="skip">تخطي التنقل إلى محتوى الوحدة</a><header class="course-header"><div class="heading"><div><small>المسار التعليمي المتكامل · خمس وحدات مترابطة</small><h1>وكلاء الذكاء الاصطناعي لدعم الجاهزية المهنية</h1></div><a class="home" href="../">المقدمة العامة للمسار ↗</a></div></header><main id="content" class="player"><iframe id="lesson" title="محتوى الوحدة التعليمية" src="../RLO1/" loading="eager" allow="fullscreen" referrerpolicy="same-origin"></iframe><nav class="course-footer" aria-label="الانتقال بين الوحدات"><a id="previous" href="?unit=1">→ الوحدة السابقة</a><div><span id="locationTitle">الوحدة الأولى من خمس</span> <span class="player-status">· التنقل بين الشاشات داخل الوحدة متاح في إطارها</span></div><a id="following" href="?unit=2">الوحدة التالية ←</a></nav></main>
<script>
(()=>{'use strict';
const pages=['../RLO1/','../RLO2/','../RLO3/','../RLO4/','../RLO5/','../survey/'];const names=['الأولى','الثانية','الثالثة','الرابعة','الخامسة'];const frame=document.getElementById('lesson');let current=0;
function validUnit(){const raw=new URLSearchParams(location.search).get('unit');const n=Number(raw);return Number.isInteger(n)&&n>=1&&n<=5?n:1}
function render(n,load=true,push=false){current=n-1;document.getElementById('locationTitle').textContent='الوحدة '+names[current]+' من خمس';const prev=document.getElementById('previous'),next=document.getElementById('following');prev.hidden=current===0;if(current>0)prev.href='?unit='+current;next.href=current===4?'../survey/':'?unit='+(current+2);next.textContent=current===4?'استبانة تقييم المسار ←':'الوحدة التالية ←';if(load)frame.src=pages[current];if(push)history.pushState({unit:n},'', '?unit='+n);else history.replaceState({unit:n},'', '?unit='+n)}

for(const id of ['previous','following'])document.getElementById(id).addEventListener('click',e=>{const a=e.currentTarget,query=new URL(a.href).searchParams.get('unit');if(!query)return;e.preventDefault();render(Number(query),true,true)});
window.addEventListener('popstate',()=>render(validUnit()));
frame.addEventListener('load',()=>{try{const url=frame.contentWindow.location.href;for(let i=0;i<5;i++){if(url.includes('/RLO'+(i+1)+'/')){if(i!==current)render(i+1,false,false);break}}}catch(e){}});
render(validUnit());
})();
</script></body></html>
